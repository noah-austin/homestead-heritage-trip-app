<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>HomesteadOS</title>
  <meta name="description" content="An entirely unnecessary web app for one family's day at Homestead Heritage in Elm Mott, Texas." />
  <meta name="theme-color" content="#f4ecd9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#17130f" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="HomesteadOS" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" />
  <link rel="stylesheet" href="style.css?v=1.5.1" />
  <script>
    // Apply saved theme before paint to avoid a flash.
    try {
      var t = localStorage.getItem('homesteados.theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>

  <!-- Boot screen. Entirely unnecessary. -->
  <div id="boot" class="boot" aria-live="polite">
    <div class="boot-inner">
      <div class="boot-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="72" height="72"><use href="icon.svg#wheel"/></svg>
      </div>
      <h1 class="boot-title">HomesteadOS</h1>
      <p class="boot-ver">v1.0.0 &middot; Waco Release</p>
      <pre id="bootlog" class="boot-log"></pre>
      <div class="boot-bar"><span id="bootbar"></span></div>
    </div>
  </div>

  <header class="top">
    <div class="brand">
      <span class="brand-name">HomesteadOS</span>
      <span class="brand-sub">A day at Homestead Heritage &middot; Elm Mott, Texas</span>
    </div>
    <div class="top-actions">
      <button id="syncDot" class="sync-dot" type="button" aria-label="Family room status" hidden><span class="dot"></span>room</button>
      <button id="themeBtn" class="icon-btn" type="button" aria-label="Toggle candlelight mode" title="Candlelight mode"><svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </div>
  </header>

  <main id="app">
    <section id="view-day" class="view" data-title="The Day"></section>
    <section id="view-bingo" class="view" data-title="Bingo" hidden></section>
    <section id="view-score" class="view" data-title="Scoreboard" hidden></section>
    <section id="view-rate" class="view" data-title="Rate" hidden></section>
    <section id="view-predict" class="view" data-title="Predict" hidden></section>
    <section id="view-road" class="view" data-title="Road Questions" hidden></section>
    <section id="view-more" class="view" data-title="More" hidden></section>
  </main>

  <nav class="tabs" aria-label="Sections">
    <button type="button" data-view="day" class="tab is-active"><span class="tab-glyph"><svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg></span>Day</button>
    <button type="button" data-view="rate" class="tab"><span class="tab-glyph"><svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.8 5.9 6.4.8-4.7 4.5 1.2 6.4L12 17.5l-5.7 3.1 1.2-6.4L2.8 9.7l6.4-.8z"/></svg></span>Rate</button>
    <button type="button" data-view="predict" class="tab"><span class="tab-glyph"><svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg></span>Predict</button>
    <button type="button" data-view="road" class="tab"><span class="tab-glyph"><svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21L9.5 3M19 21L14.5 3M12 7v2M12 13v2M12 19v2"/></svg></span>Road</button>
    <button type="button" data-view="more" class="tab"><span class="tab-glyph"><svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg></span>More</button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="modal" class="modal">
    <div class="modal-body" id="modalBody"></div>
  </dialog>

  <script src="app.js?v=1.5.1"></script>
</body>
</html>
